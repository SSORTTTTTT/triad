name: Build macOS installer

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: "Apple Silicon runner (macos-15 normally; macos-26 when GitHub has no macos-15 free)"
        required: false
        default: macos-15

permissions:
  contents: write   # lets the last step publish logs and the .pkg to the ci-results branch

jobs:
  build:
    name: Build, package and validate (Apple Silicon)
    runs-on: ${{ inputs.runner || 'macos-15' }}   # Apple Silicon (macos-14 is being retired by GitHub: 2026-11-02)
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4

      - name: Build AU + VST3 and create the .pkg (Build-Mac.command)
        run: bash Build-Mac.command

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Triad-macOS-AppleSilicon-pkg
          path: Installer/*.pkg
          if-no-files-found: error

      - name: Inspect package contents
        run: |
          set -euo pipefail
          ls -l Installer/*.pkg
          test "$(ls Installer/*.pkg | wc -l | tr -d ' ')" = 3   # Triad v18, Triad Time and Triad Split
          for pkg in Installer/*.pkg; do
            echo "==== $pkg"
            pkgutil --check-signature "$pkg" || true
            rm -rf inspect && mkdir -p inspect && (cd inspect && xar -xf "../$pkg" && ls -R . | head -n 40)
            for c in inspect/*.pkg; do echo "== $c payload"; pkgutil --payload-files "$c" 2>/dev/null || lsbom "$c/Bom"; done
          done

      - name: Install the .pkg on the runner
        run: |
          set -euo pipefail
          # Simulate earlier "Triad", "Triad v2" ... "Triad v17" installs: the v18 package must remove them.
          for old in "Triad" "Triad v2" "Triad v3" "Triad v4" "Triad v5" "Triad v6" "Triad v7" "Triad v8" "Triad v9" "Triad v10" "Triad v11" "Triad v12" "Triad v13" "Triad v14" "Triad v15" "Triad v16" "Triad v17"; do
            sudo ditto "build-mac/Triad_artefacts/Release/VST3/Triad v18.vst3" "/Library/Audio/Plug-Ins/VST3/$old.vst3"
            sudo ditto "build-mac/Triad_artefacts/Release/AU/Triad v18.component" "/Library/Audio/Plug-Ins/Components/$old.component"
          done
          sudo installer -pkg Installer/Triad-v18-*.pkg -target / -verboseR
          sudo installer -pkg Installer/Triad-Time-*.pkg -target / -verboseR
          sudo installer -pkg Installer/Triad-Split-*.pkg -target / -verboseR
          pkgutil --pkgs | grep thomasross
          for old in "/Library/Audio/Plug-Ins/VST3/Triad.vst3" "/Library/Audio/Plug-Ins/Components/Triad.component" \
                     "/Library/Audio/Plug-Ins/VST3/Triad v2.vst3" "/Library/Audio/Plug-Ins/Components/Triad v2.component" \
                     "/Library/Audio/Plug-Ins/VST3/Triad v3.vst3" "/Library/Audio/Plug-Ins/Components/Triad v3.component" \
                     "/Library/Audio/Plug-Ins/VST3/Triad v4.vst3" "/Library/Audio/Plug-Ins/Components/Triad v4.component" \
                     "/Library/Audio/Plug-Ins/VST3/Triad v5.vst3" "/Library/Audio/Plug-Ins/Components/Triad v5.component" \
                     "/Library/Audio/Plug-Ins/VST3/Triad v6.vst3" "/Library/Audio/Plug-Ins/Components/Triad v6.component" \
                     "/Library/Audio/Plug-Ins/VST3/Triad v7.vst3" "/Library/Audio/Plug-Ins/Components/Triad v7.component" \
                     "/Library/Audio/Plug-Ins/VST3/Triad v8.vst3" "/Library/Audio/Plug-Ins/Components/Triad v8.component" \
                     "/Library/Audio/Plug-Ins/VST3/Triad v9.vst3" "/Library/Audio/Plug-Ins/Components/Triad v9.component" \
                     "/Library/Audio/Plug-Ins/VST3/Triad v10.vst3" "/Library/Audio/Plug-Ins/Components/Triad v10.component" \
                     "/Library/Audio/Plug-Ins/VST3/Triad v11.vst3" "/Library/Audio/Plug-Ins/Components/Triad v11.component" \
                     "/Library/Audio/Plug-Ins/VST3/Triad v12.vst3" "/Library/Audio/Plug-Ins/Components/Triad v12.component" \
                     "/Library/Audio/Plug-Ins/VST3/Triad v13.vst3" "/Library/Audio/Plug-Ins/Components/Triad v13.component" \
                     "/Library/Audio/Plug-Ins/VST3/Triad v14.vst3" "/Library/Audio/Plug-Ins/Components/Triad v14.component" \
                     "/Library/Audio/Plug-Ins/VST3/Triad v15.vst3" "/Library/Audio/Plug-Ins/Components/Triad v15.component" \
                     "/Library/Audio/Plug-Ins/VST3/Triad v16.vst3" "/Library/Audio/Plug-Ins/Components/Triad v16.component" \
                     "/Library/Audio/Plug-Ins/VST3/Triad v17.vst3" "/Library/Audio/Plug-Ins/Components/Triad v17.component"; do
            if [ -e "$old" ]; then echo "::error::$old was not removed"; exit 1; fi
            echo "removed old $old"
          done
          for name in "Triad Time" "Triad Split"; do
            for b in "/Library/Audio/Plug-Ins/Components/$name.component" "/Library/Audio/Plug-Ins/VST3/$name.vst3"; do
              ls -ld "$b"; lipo -archs "$b/Contents/MacOS/$name"; codesign --verify --deep --strict --verbose=2 "$b"; du -sh "$b"
            done
          done
          for b in "/Library/Audio/Plug-Ins/Components/Triad v18.component" "/Library/Audio/Plug-Ins/VST3/Triad v18.vst3"; do
            ls -ld "$b"; lipo -archs "$b/Contents/MacOS/Triad v18"; codesign --verify --deep --strict --verbose=2 "$b"
            du -sh "$b"
            # The installed scanner helper works (it checks Triad itself here).
            "$b/Contents/Helpers/Triad Scanner" --scan "/Library/Audio/Plug-Ins/VST3/Triad v18.vst3" "$RUNNER_TEMP/scan.xml"
            grep -q 'name="Triad v18"' "$RUNNER_TEMP/scan.xml" && echo "Triad Scanner in $b works"
          done

      - name: Validate the Audio Unit (auval)
        run: |
          set -euo pipefail
          sleep 5
          auval -a | grep -i triad
          auval -v aufx Trid Tsrt | tee auval.log
          grep -q "AU VALIDATION SUCCEEDED" auval.log
          auval -v aufx TrTm Tsrt | tee auval-time.log
          grep -q "AU VALIDATION SUCCEEDED" auval-time.log
          auval -v aufx TrSp Tsrt | tee auval-split.log
          grep -q "AU VALIDATION SUCCEEDED" auval-split.log

      - name: Integration tests (native arm64)
        run: |
          set -euo pipefail
          cmake -S . -B build-tests -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DTRIAD_BUILD_TESTS=ON -DJUCE_SOURCE_DIR="$PWD/deps/JUCE"
          cmake --build build-tests --config Release --target TriadTests TriadStress TriadScanner TriadCrashFixture \
            TriadTestEffect_VST3 TriadTestSynth_VST3 Triad_VST3 --parallel "$(sysctl -n hw.ncpu)"
          exe="$(find build-tests/TriadTests_artefacts -type f -perm -u+x -name 'Triad*Tests' | head -n 1)"
          scanner="$(find build-tests/TriadScanner_artefacts -type f -perm -u+x -name 'Triad*Scanner' | head -n 1)"
          echo "$PWD/$scanner" > scanner-path.txt
          mkdir -p ci-ui
          set +e   # keep going after a failure, to collect its crash report
          "$exe" "$PWD/build-tests/TriadTestEffect_artefacts/Release/VST3/Triad Test Effect.vst3" \
                 "$PWD/build-tests/TriadTestSynth_artefacts/Release/VST3/Triad Test Synth.vst3" \
                 "$PWD/build-tests/fixtures/Triad Crash Fixture.vst3" \
                 "$PWD/$scanner" \
                 "$PWD/ci-ui/Triad-preview-mac.png" \
                 "$PWD/build-tests/Triad_artefacts/Release/VST3/Triad v18.vst3" \
                 "/Library/Audio/Plug-Ins/VST3/Triad Split.vst3" 2>&1 | tee test-results-mac.txt
          status=${PIPESTATUS[0]}
          echo "Integration tests exit code: $status" | tee -a test-results-mac.txt
          if [ "$status" -ne 0 ]; then
            sleep 15
            i=0
            for f in "$HOME"/Library/Logs/DiagnosticReports/*Tests* /Library/Logs/DiagnosticReports/*Tests*; do
              [ -f "$f" ] || continue
              i=$((i + 1)); cp "$f" "test-crash-$i.txt"; echo "Crash report: $f"
            done
          fi
          exit $status

      - name: Stress test (hundreds of effects, random edits while audio plays)
        run: |
          set -euo pipefail
          exe="$(find build-tests/TriadStress_artefacts -type f -perm -u+x -name 'Triad*Stress' | head -n 1)"
          "$exe" "$PWD/build-tests/TriadTestEffect_artefacts/Release/VST3/Triad Test Effect.vst3" \
                 "$PWD/build-tests/fixtures/Triad Crash Fixture.vst3" \
                 "$(cat scanner-path.txt)" \
                 "$PWD/stress-results.txt" 2>&1 | tee stress-log.txt

      - name: Stress test with real third-party plug-ins and every LFO on
        continue-on-error: true
        timeout-minutes: 85
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          bash ci/install-free-plugins.sh 2>&1 | tee free-plugins.log
          exe="$(find build-tests/TriadStress_artefacts -type f -perm -u+x -name 'Triad*Stress' | head -n 1)"
          "$exe" "$PWD/build-tests/TriadTestEffect_artefacts/Release/VST3/Triad Test Effect.vst3" \
                 "$PWD/build-tests/fixtures/Triad Crash Fixture.vst3" \
                 "$(cat scanner-path.txt)" \
                 "$PWD/stress-real.txt" 777 --real 2>&1 | tee stress-real-log.txt
          status=${PIPESTATUS[0]}
          echo "Stress test exit code: $status" | tee -a stress-real-log.txt
          if [ "$status" -ne 0 ]; then
            # macOS writes a crash report with every thread's call stack a few seconds after a crash.
            sleep 15
            i=0
            for f in "$HOME"/Library/Logs/DiagnosticReports/*Stress* /Library/Logs/DiagnosticReports/*Stress*; do
              [ -f "$f" ] || continue
              i=$((i + 1)); cp "$f" "stress-real-crash-$i.txt"; echo "Crash report: $f"
            done
          fi
          exit $status

      - name: pluginval (VST3 and AU, strictness 5)
        continue-on-error: true
        run: |
          set -uo pipefail
          curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          pv=pluginval.app/Contents/MacOS/pluginval
          "$pv" --strictness-level 5 --skip-gui-tests --validate "/Library/Audio/Plug-Ins/VST3/Triad v18.vst3" | tee pluginval-vst3.log
          vst3=${PIPESTATUS[0]}
          "$pv" --strictness-level 5 --skip-gui-tests --validate "/Library/Audio/Plug-Ins/Components/Triad v18.component" | tee pluginval-au.log
          au=${PIPESTATUS[0]}
          "$pv" --strictness-level 5 --skip-gui-tests --validate "/Library/Audio/Plug-Ins/VST3/Triad Time.vst3" | tee pluginval-time-vst3.log
          tvst3=${PIPESTATUS[0]}
          "$pv" --strictness-level 5 --skip-gui-tests --validate "/Library/Audio/Plug-Ins/Components/Triad Time.component" | tee pluginval-time-au.log
          tau=${PIPESTATUS[0]}
          "$pv" --strictness-level 5 --skip-gui-tests --validate "/Library/Audio/Plug-Ins/VST3/Triad Split.vst3" | tee pluginval-split-vst3.log
          svst3=${PIPESTATUS[0]}
          "$pv" --strictness-level 5 --skip-gui-tests --validate "/Library/Audio/Plug-Ins/Components/Triad Split.component" | tee pluginval-split-au.log
          sau=${PIPESTATUS[0]}
          echo "pluginval exit codes: Triad VST3=$vst3 AU=$au; Triad Time VST3=$tvst3 AU=$tau; Triad Split VST3=$svst3 AU=$sau"
          [ "$vst3" -eq 0 ] && [ "$au" -eq 0 ] && [ "$tvst3" -eq 0 ] && [ "$tau" -eq 0 ] && [ "$svst3" -eq 0 ] && [ "$sau" -eq 0 ]

      - name: Report errors as annotations
        if: failure()
        run: |
          for f in build-mac.log auval.log auval-time.log auval-split.log test-results-mac.txt stress-log.txt; do
            [ -f "$f" ] || continue
            msg=$( (grep -n -E "error:|error :|CMake Error|ERROR|FAIL|fatal:|No such file|Undefined symbols" "$f" | head -n 40; echo "--- last 60 lines ---"; tail -n 60 "$f") \
                   | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=$f::$msg"
          done

      - name: Upload logs and Mac UI snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-mac.log
            auval.log
            auval-time.log
            auval-split.log
            test-results-mac.txt
            stress-results.txt
            stress-log.txt
            stress-real.txt
            stress-real-log.txt
            stress-*hang-sample.txt
            stress-real-crash-*.txt
            test-crash-*.txt
            free-plugins.log
            pluginval-*.log
            ci-ui/*.png
          if-no-files-found: ignore

      - name: Publish logs and installer to the ci-results branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -u
          out="$RUNNER_TEMP/ci-results"; rm -rf "$out"; mkdir -p "$out"
          cp -f build-mac.log auval.log auval-time.log auval-split.log test-results-mac.txt stress-results.txt stress-log.txt stress-real.txt stress-real-log.txt stress-*hang-sample.txt stress-real-crash-*.txt test-crash-*.txt free-plugins.log pluginval-*.log "$out/" 2>/dev/null || true
          cp -f Installer/*.pkg ci-ui/*.png "$out/" 2>/dev/null || true
          echo "run=${{ github.run_id }} sha=${{ github.sha }} job_status=${{ job.status }}" > "$out/RUN.txt"
          cd "$out"
          git init -q -b ci-results
          git add -A
          git -c user.name="Triad CI" -c user.email="actions@users.noreply.github.com" commit -q -m "CI results for ${{ github.sha }} (${{ job.status }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" ci-results
